<svg xmlns="http://www.w3.org/2000/svg" width="680" height="452" viewBox="0 0 680 452" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="14">
  <rect width="680" height="452" rx="10" fill="#1a1a1a"/>
  <circle cx="24" cy="24" r="5" fill="#eb5757"/>
  <circle cx="42" cy="24" r="5" fill="#f2c94c"/>
  <circle cx="60" cy="24" r="5" fill="#a5d65f"/>
  <text x="340" y="29" fill="#7a7568" text-anchor="middle">main.ts</text>
  <g xml:space="preserve">
    <text x="24" y="66"><tspan fill="#f2c94c">import</tspan><tspan fill="#a8a396"> { </tspan><tspan fill="#ffae57">serve</tspan><tspan fill="#a8a396"> } </tspan><tspan fill="#f2c94c">from</tspan><tspan fill="#a5d65f"> "./server"</tspan></text>
    <text x="24" y="110"><tspan fill="#7a7568" font-style="italic">// retry the dev server until it comes up</tspan></text>
    <text x="24" y="132"><tspan fill="#f2c94c">const</tspan><tspan fill="#ffa1ad"> MAX_RETRIES</tspan><tspan fill="#a8a396"> = </tspan><tspan fill="#ffa1ad">3</tspan></text>
    <text x="24" y="176"><tspan fill="#f2c94c">type</tspan><tspan fill="#7fd8ce"> Config</tspan><tspan fill="#a8a396"> = {</tspan></text>
    <text x="24" y="198"><tspan fill="#d8d3c3">  host</tspan><tspan fill="#a8a396">: </tspan><tspan fill="#7fd8ce">string</tspan></text>
    <text x="24" y="220"><tspan fill="#d8d3c3">  port</tspan><tspan fill="#a8a396">: </tspan><tspan fill="#7fd8ce">number</tspan></text>
    <text x="24" y="242"><tspan fill="#a8a396">}</tspan></text>
    <text x="24" y="286"><tspan fill="#f2c94c">async function</tspan><tspan fill="#ffae57"> main</tspan><tspan fill="#a8a396">(</tspan><tspan fill="#d8d3c3">cfg</tspan><tspan fill="#a8a396">: </tspan><tspan fill="#7fd8ce">Config</tspan><tspan fill="#a8a396">): </tspan><tspan fill="#7fd8ce">Promise</tspan><tspan fill="#a8a396">&lt;</tspan><tspan fill="#7fd8ce">void</tspan><tspan fill="#a8a396">&gt; {</tspan></text>
    <text x="24" y="308"><tspan fill="#f2c94c">  const</tspan><tspan fill="#d8d3c3"> url</tspan><tspan fill="#a8a396"> = </tspan><tspan fill="#a5d65f">`http://</tspan><tspan fill="#ffa1ad">${</tspan><tspan fill="#d8d3c3">cfg.host</tspan><tspan fill="#ffa1ad">}</tspan><tspan fill="#a5d65f">:</tspan><tspan fill="#ffa1ad">${</tspan><tspan fill="#d8d3c3">cfg.port</tspan><tspan fill="#ffa1ad">}</tspan><tspan fill="#a5d65f">`</tspan></text>
    <text x="24" y="330"><tspan fill="#f2c94c">  for</tspan><tspan fill="#a8a396"> (</tspan><tspan fill="#f2c94c">let</tspan><tspan fill="#d8d3c3"> i</tspan><tspan fill="#a8a396"> = </tspan><tspan fill="#ffa1ad">0</tspan><tspan fill="#a8a396">; </tspan><tspan fill="#d8d3c3">i</tspan><tspan fill="#a8a396"> &lt; </tspan><tspan fill="#ffa1ad">MAX_RETRIES</tspan><tspan fill="#a8a396">; </tspan><tspan fill="#d8d3c3">i</tspan><tspan fill="#a8a396">++) {</tspan></text>
    <text x="24" y="352"><tspan fill="#f2c94c">    if</tspan><tspan fill="#a8a396"> (</tspan><tspan fill="#f2c94c">await</tspan><tspan fill="#ffae57"> serve</tspan><tspan fill="#a8a396">(</tspan><tspan fill="#d8d3c3">url</tspan><tspan fill="#a8a396">, { </tspan><tspan fill="#d8d3c3">secure</tspan><tspan fill="#a8a396">: </tspan><tspan fill="#ffa1ad">true</tspan><tspan fill="#a8a396"> })) </tspan><tspan fill="#f2c94c">return</tspan></text>
    <text x="24" y="374"><tspan fill="#a8a396">  }</tspan></text>
    <text x="24" y="396"><tspan fill="#f2c94c">  throw new</tspan><tspan fill="#7fd8ce"> Error</tspan><tspan fill="#a8a396">(</tspan><tspan fill="#a5d65f">"server did not start"</tspan><tspan fill="#a8a396">)</tspan></text>
    <text x="24" y="418"><tspan fill="#a8a396">}</tspan></text>
  </g>
</svg>
