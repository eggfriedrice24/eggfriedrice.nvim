# eggfriedrice for Starship
# generated from lua/eggfriedrice/colors.lua by `make extras`; do not edit by hand
# install: paste into starship.toml and reference the names in `style`

palette = "eggfriedrice"

[palettes.eggfriedrice]
# base
bg = "#0d111a"
bg_dark = "#090c13"
bg_light = "#121722"
fg = "#d8d3c3"
fg_dark = "#a8a396"
comment = "#8695b7"

# accents (these names shadow starship's ANSI names on purpose)
yellow = "#ffc940"
orange = "#fc9a2c"
red = "#e06c75"
green = "#60e654"
cyan = "#78e2d6"
blue = "#6cb8ff"
purple = "#c084fc"

# roles, one per module
directory = "#78e2d6"
git_branch = "#c084fc"
git_status_clean = "#60e654"
git_status_dirty = "#ffc940"
git_status_ahead = "#78e2d6"
git_status_behind = "#fc9a2c"
git_status_conflicted = "#e06c75"
character_success = "#ffc940"
character_error = "#e06c75"
character_vimcmd = "#c084fc"
cmd_duration = "#fc9a2c"
language = "#6cb8ff"
status = "#e06c75"
jobs = "#78e2d6"
time = "#8695b7"
username = "#a8a396"
hostname = "#a8a396"

# module styles that use them; merge into your own module tables
# [character]
# success_symbol = "[❯](bold character_success)"
# error_symbol = "[❯](bold character_error)"
# vimcmd_symbol = "[❮](bold character_vimcmd)"
#
# [directory]
# style = "bold directory"
#
# [git_branch]
# style = "git_branch"
#
# [git_status]
# style = "git_status_dirty"
# up_to_date = "[✓](git_status_clean)"
# ahead = "[↑$count](git_status_ahead)"
# behind = "[↓$count](git_status_behind)"
# diverged = "[↕↑$ahead_count↓$behind_count](git_status_behind)"
# conflicted = "[=](bold git_status_conflicted)"
#
# [cmd_duration]
# style = "cmd_duration"
#
# [nodejs]  # and python, golang, java, rust...
# style = "language"
#
# [status]
# style = "status"
#
# [jobs]
# style = "jobs"
#
# [time]
# style = "time"
#
# [username]
# style = "username"
#
# [hostname]
# style = "hostname"
