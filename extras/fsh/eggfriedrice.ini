; eggfriedrice for fast-syntax-highlighting
; generated from lua/eggfriedrice/colors.lua by `make extras`; do not edit by hand
; install: copy to ~/.config/fsh/eggfriedrice.ini and run `fast-theme XDG:eggfriedrice`

[base]
default          = #d8d3c3
unknown-token    = #e06c75,bold,underline
commandseparator = #6cb8ff
redirection      = #6cb8ff
here-string-tri  = #6cb8ff
here-string-text = #60e654
here-string-var  = #e06c75
exec-descriptor  = #6cb8ff
comment          = #8695b7
correct-subtle   = #60e654
incorrect-subtle = #e06c75
subtle-separator = #8695b7
subtle-bg        = bg:#121722
secondary        = free
recursive-base   = none

[command-point]
reserved-word     = #c084fc
subcommand        = #ffc940
alias             = #ffc940
suffix-alias      = #ffc940
global-alias      = #ffc940
builtin           = #ffc940
function          = #ffc940
command           = #ffc940
precommand        = #ffc940
hashed-command    = #ffc940
single-sq-bracket = #6cb8ff
double-sq-bracket = #6cb8ff
double-paren      = #6cb8ff

[paths]
path          = #d8d3c3,underline
pathseparator =
path-to-dir   = #d8d3c3,underline
globbing      = #6cb8ff
globbing-ext  = #6cb8ff

[brackets]
paired-bracket  = bg:#2f3b54
bracket-level-1 = #a8a396
bracket-level-2 = #a8a396
bracket-level-3 = #a8a396

[arguments]
single-hyphen-option   = #78e2d6
double-hyphen-option   = #78e2d6
back-quoted-argument   = #78e2d6
single-quoted-argument = #60e654
double-quoted-argument = #60e654
dollar-quoted-argument = #60e654
optarg-string          = #60e654
optarg-number          = #ffc940

[in-string]
back-dollar-quoted-argument           = #78e2d6
back-or-dollar-double-quoted-argument = #e06c75

[other]
variable             = #e06c75
assign               = #e06c75
assign-array-bracket = #a8a396
history-expansion    = #c084fc

[math]
mathvar = #e06c75
mathnum = #ffc940
matherr = #e06c75,bold

[for-loop]
forvar  = #e06c75
fornum  = #ffc940
foroper = #6cb8ff
forsep  = #a8a396

[case]
case-input       = #60e654
case-parentheses = #a8a396
case-condition   = #78e2d6
